const app=document.getElementById('app');let exam=[],answers=[],idx=0,seconds=3600,clock=null,ended=false,immediate=true;
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function graph(q){if(!q.graph)return '';let v=q.graph,m=Math.max(...v),w=540;return `<svg viewBox="0 0 540 230" role="img" aria-label="曜日別データの棒グラフ">${v.map((n,i)=>`<rect x="${55+i*125}" y="${178-n/m*140}" width="60" height="${n/m*140}" fill="#2381ae"/><text x="${85+i*125}" y="${169-n/m*140}" text-anchor="middle" font-size="16">${n}</text><text x="${85+i*125}" y="205" text-anchor="middle" font-size="17">${['月','火','水','木'][i]}</text>`).join('')}<line x1="25" y1="180" x2="520" y2="180" stroke="#566"/></svg>`}
function startScreen(){clearInterval(clock);ended=false;app.innerHTML=`<div class="card"><h1>CBT 模擬試験</h1><p>学習用テキスト第3版に対応した練習問題。各章から50問を出題します。問題と選択肢は日本語のみ、ふりがなはありません。</p><p><b>50問 / 60分 / 200点満点 / 合格ライン130点</b>（本アプリ独自の採点方式）</p><label>出題範囲<select id="mode"><option value="all">第1～6章（各章から出題）</option>${CH.map((n,i)=>`<option value="${i}">${n}（この章だけ50問）</option>`).join('')}</select></label><label><input id="instant" type="checkbox" checked> 回答直後に正誤・解説・計算式を表示する</label><p class="muted">チェックを外すと、試験終了後に解説を確認できます。</p><button class="btn" id="go">試験を開始する</button><p class="warning">※公式CBT問題ではありません。1000問は学習テーマを組み合わせたバリエーションです。</p></div><div class="card"><b>教材の章構成</b>${CH.map((v,i)=>`<p>${esc(v)}</p>`).join('')}<p>グラフ問題は第3章・第4章、労働災害は第5章に配置しています。</p></div>`;document.getElementById('go').onclick=begin}
function begin(){let mode=document.getElementById('mode').value;immediate=document.getElementById('instant').checked;let counts=mode==='all'?[9,9,8,9,8,7]:Array.from({length:6},(_,i)=>i===Number(mode)?50:0);exam=[];for(let ch=0;ch<6;ch++){let pool=shuffle(BANK.filter(x=>x.ch===ch));exam.push(...pool.slice(0,counts[ch]))}exam=shuffle(exam);let points=shuffle(Array.from({length:50},(_,i)=>2+Math.floor(i/10)));exam=exam.map((q,i)=>({...q,pts:points[i]}));answers=Array(50).fill(null);idx=0;seconds=3600;ended=false;clearInterval(clock);clock=setInterval(()=>{seconds--;let t=document.getElementById('timer');if(t)t.textContent=time();if(seconds<=0)finish()},1000);render()}
function time(){return `${String(Math.max(0,Math.floor(seconds/60))).padStart(2,'0')}:${String(Math.max(0,seconds%60)).padStart(2,'0')}`}
function choose(i){if(ended)return;answers[idx]=i;render()}
function render(){let q=exam[idx],a=answers[idx];app.innerHTML=`<div class="card"><div class="row"><b>問題 ${idx+1} / 50</b><b id="timer">${time()}</b></div><p class="muted">${esc(CH[q.ch])} · ${q.pts}点</p><div class="bar"><div style="width:${(idx+1)*2}%"></div></div><h2>${esc(q.jp)}</h2>${graph(q)}${q.opts.map((o,i)=>`<button class="option ${a===i?'sel':''} ${immediate&&a!==null&&i===q.ans?'correct':''} ${immediate&&a===i&&i!==q.ans?'wrong':''}" data-opt="${i}"><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}${immediate&&a!==null?`<div class="answer"><b class="${a===q.ans?'good':'bad'}">${a===q.ans?'正解':'不正解'}</b><p><b>正しい答え：${'ABCD'[q.ans]}.</b> ${esc(q.opts[q.ans])}</p><p><b>${q.kind==='math'?'計算方法・解説':'解説'}：</b>${esc(q.ex)}</p>${a!==q.ans?`<p><b>誤答の理由：</b>選んだ選択肢「${esc(q.opts[a])}」は正しくありません。${esc(q.ex)}</p>`:''}</div>`:''}<div class="row"><button class="btn alt" id="prev" ${idx===0?'disabled':''}>前へ</button><button class="btn" id="next">${idx===49?'解答を確認':'次へ'}</button></div><p class="muted">解答済み：${answers.filter(x=>x!==null).length}/50</p><div class="nav">${exam.map((x,i)=>`<button class="${i===idx?'current':''} ${answers[i]!==null?'done':''}" data-nav="${i}">${i+1}</button>`).join('')}</div></div><div class="card"><button class="btn red" id="finish">試験を終了して採点する</button></div>`;app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>choose(+b.dataset.opt));app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{idx=+b.dataset.nav;render()});document.getElementById('prev').onclick=()=>{idx--;render()};document.getElementById('next').onclick=()=>{if(idx<49){idx++;render()}else finish()};document.getElementById('finish').onclick=()=>{if(confirm('試験を終了して採点しますか？'))finish()}}
function finish(){if(ended)return;ended=true;clearInterval(clock);let score=exam.reduce((s,q,i)=>s+(answers[i]===q.ans?q.pts:0),0),correct=exam.filter((q,i)=>answers[i]===q.ans).length;app.innerHTML=`<div class="card"><h1>試験結果</h1><div class="score ${score>=130?'good':'bad'}">${score} / 200点</div><h2>${score>=130?'合格（練習基準）':'不合格（練習基準）'}</h2><p>正解 ${correct}/50問 · 合格ライン130点</p><button class="btn" id="restart">もう一度練習する</button></div><div class="card"><h2>全50問の解説</h2>${exam.map((q,i)=>`<details ${answers[i]!==q.ans?'open':''}><summary>問題 ${i+1} · ${esc(CH[q.ch])} · ${answers[i]===q.ans?'✓ 正解':'✗ 不正解'} · ${q.pts}点</summary><p>${esc(q.jp)}</p>${graph(q)}<p>あなたの解答：${answers[i]===null?'未解答':`${'ABCD'[answers[i]]}. ${esc(q.opts[answers[i]])}`}</p><p><b>正答：${'ABCD'[q.ans]}. ${esc(q.opts[q.ans])}</b></p><p><b>${q.kind==='math'?'計算式と計算方法':'理由と解説'}：</b>${esc(q.ex)}</p></details>`).join('')}</div>`;document.getElementById('restart').onclick=startScreen;window.scrollTo(0,0)}
startScreen();</script></body></html>
