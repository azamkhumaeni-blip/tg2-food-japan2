function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setup(){clearInterval(tick);started=false;ended=false;timer.textContent='60:00';app.innerHTML=`<div class="card"><h2>Simulasi Ujian CBT TG2 Pengolahan Makanan</h2><p>50 soal acak dari 1.023 variasi berbasis skenario dan parameter · Materi Bab 1–6 · 60 menit · Nilai maksimal <b>200 poin</b>.</p><p>Bobot soal bervariasi: 2, 3, 4, 5, atau 6 poin. Ada 10 soal untuk setiap bobot, sehingga total tepat 200 poin.</p><p class="muted">Bobot 2–6 poin adalah rancangan simulasi. Ambang lulus latihan ditetapkan 130/200 sesuai permintaan, bukan klaim sistem penilaian resmi CBT.</p><label>Materi ujian <select id="mode"><option value="all">Campuran Bab 1–6</option>${CH.map((v,i)=>`<option value="${i}">${esc(v)}</option>`).join('')}</select></label><p><b>Mode ujian: Bahasa Jepang saja, tanpa furigana dan tanpa terjemahan.</b></p><p><b>Distribusi mode campuran:</b> Bab 1: 9 soal · Bab 2: 9 soal · Bab 3: 8 soal · Bab 4: 8 soal (termasuk kecelakaan kerja dan grafik) · Bab 5: 8 soal · Bab 6: 8 soal.</p><p class="muted">Untuk latihan satu bab, pilih Bab 1, 2, 3, 4, 5, atau 6 pada menu Materi ujian. Setiap sesi tetap 50 soal dan 200 poin.</p><p><b>Nilai minimum lulus: 130 dari 200 poin (65%).</b></p><p><b>Mode ujian:</b> Jawaban dan pembahasan baru ditampilkan setelah ujian dikumpulkan. Untuk soal hitungan, tersedia rumus pada hasil ujian.</p><button class="btn" id="start">Mulai Ujian CBT</button></div><div class="card"><b>Fitur ujian</b><p>Nomor 1–50, tandai ragu-ragu, soal belum dijawab, hitung mundur, kumpulkan jawaban, nilai berbobot dan pembahasan setelah selesai.</p><p class="muted">Latihan independen berdasarkan topik TG2, bukan soal resmi atau tampilan identik penyelenggara CBT.</p></div>`;document.getElementById('start').onclick=start}
let passing=130;
function start(){mode=document.getElementById('mode').value;instantMath=false;showTranslation=false;passing=130;let chosen;if(mode==='all'){
 const mandatory=[...Array.from({length:7},(_,i)=>BANK.find(q=>q.visual==='qc'+i)),...shuffle(BANK.filter(q=>q.visual&&['slip','machine','chemical','steam'].includes(q.visual))).slice(0,2),...shuffle(BANK.filter(q=>q.idnum>=2008&&q.idnum<=2019)).slice(0,5)];
 const selected=new Set(mandatory.map(q=>q.idnum));chosen=[...mandatory];
 const quota=[7,8,7,6,6,6];for(let ch=0;ch<6;ch++){let have=chosen.filter(q=>q.ch===ch).length;for(const q of shuffle(BANK.filter(q=>q.ch===ch&&!selected.has(q.idnum))).slice(0,Math.max(0,quota[ch]-have))){chosen.push(q);selected.add(q.idnum)}}
 chosen.push(...shuffle(BANK.filter(q=>!selected.has(q.idnum))).slice(0,50-chosen.length));
}else chosen=shuffle(BANK.filter(x=>x.ch===+mode)).slice(0,50);qs=shuffle(chosen).slice(0,50).map(x=>({...x}));let weights=shuffle(Array.from({length:50},(_,i)=>2+Math.floor(i/10)));qs.forEach((q,i)=>q.points=weights[i]);answers=Array(50).fill(null);flags=Array(50).fill(false);index=0;seconds=3600;started=true;ended=false;tick=setInterval(()=>{seconds--;timer.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;if(seconds<=0)finish(true)},1000);render()}

return wrap('<rect x="25" y="28" width="310" height="148" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>'+`<text x="180" y="96" font-size="23" text-anchor="middle">${symbols[type]||'⚠️ 危険'}</text>`+txt(180,132,'危険源を確認して安全対策を選ぶ'),'労働災害');
}
function render(){if(ended)return;let q=qs[index],count=answers.filter(x=>x!==null).length;app.innerHTML=`<div class="row"><span class="tag">${esc(CH[q.ch])}</span><span class="muted">Terjawab ${count}/50 · Total 200 poin</span></div><div class="bar" style="margin:12px 0"><div class="fill" style="width:${count*2}%"></div></div><div class="cols"><section class="card"><div class="row"><h3>Soal ${index+1} dari 50</h3><span class="tag">Bobot ${q.points} poin</span></div><p class="jp">${esc(q.jp)}</p>${q.graph?graphSVG(q.graph):''}${q.visual?visualSVG(q.visual):''}${showTranslation?`<p>${esc(q.id)}</p>`:''}<div>${q.opts.map((o,i)=>`<button class="choice ${answers[index]===i?'active':''}" data-opt="${i}"><b>${'ABCD'[i]}.</b> ${esc(o.split('|')[0])}${showTranslation&&o.includes('|')?`<br><span class="muted">${esc(o.split('|')[1])}</span>`:''}</button>`).join('')}</div>${false?`<div class="answer"><b class="${answers[index]===q.ans?'good':'bad'}">${answers[index]===q.ans?'Benar — 正解':'Salah — 不正解'}</b><p><b>Jawaban benar:</b> ${'ABCD'[q.ans]} — ${esc(q.opts[q.ans].split('|')[0])}</p><p><b>${q.ch===4?'Rumus dan cara menghitung:':'Penjelasan jawaban:'}</b><p>${esc(q.ex)}</p><p class="muted">${esc(q.id)}</p></p>${answers[index]!==q.ans?`<p><b>Mengapa salah?</b> ${esc(wrongReason(q,answers[index]))}</p>`:''}</div>`:''}<div class="row" style="margin-top:20px"><button class="btn alt" id="prev" ${index===0?'disabled':''}>← Sebelumnya</button><button class="btn alt" id="flag">${flags[index]?'★ Ditandai':'☆ Tandai ragu'}</button><button class="btn" id="next">${index===49?'Kembali ke nomor 1':'Berikutnya →'}</button></div></section><aside class="card"><h3>Navigasi Soal</h3><div class="grid">${qs.map((_,i)=>`<button class="num ${answers[i]!==null?'done':''} ${flags[i]?'flag':''} ${index===i?'current':''}" data-num="${i}">${i+1}</button>`).join('')}</div><p class="muted" style="font-size:12px">Hijau: dijawab · Kuning: ragu · Biru: aktif</p><button class="btn red" id="submit" style="width:100%">Kumpulkan Ujian</button></aside></div>`;app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{answers[index]=+b.dataset.opt;render()});app.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{index=+b.dataset.num;render()});document.getElementById('prev').onclick=()=>{index--;render()};document.getElementById('next').onclick=()=>{index=(index+1)%50;render()};document.getElementById('flag').onclick=()=>{flags[index]=!flags[index];render()};document.getElementById('submit').onclick=()=>{let missing=answers.filter(x=>x===null).length;if(confirm(`Kumpulkan ujian sekarang? ${missing} soal belum dijawab.`))finish(false)}}
function wrongReason(q,choice){
 if(choice===null)return 'Tidak ada jawaban yang dipilih. Perhatikan kata kunci pada pertanyaan, kemudian cocokkan dengan prosedur atau perhitungan yang benar.';
 let wrong=q.opts[choice].split('|');
 let right=q.opts[q.ans].split('|');
 if(q.ch===4)return 'Jawaban yang dipilih menghasilkan nilai yang tidak sesuai. Periksa kembali rumus, satuan, urutan operasi, dan pembulatan. '+q.ex;
 return 'Pilihan '+('ABCD'[choice])+' ('+(wrong[1]||wrong[0])+') tidak menyelesaikan risiko atau kondisi utama dalam soal. Tindakan yang tepat adalah '+(right[1]||right[0])+'. '+q.ex;
}
function finish(auto){if(ended)return;clearInterval(tick);ended=true;let score=qs.reduce((sum,q,i)=>sum+(answers[i]===q.ans?q.points:0),0),correct=qs.filter((q,i)=>answers[i]===q.ans).length;timer.textContent='SELESAI';app.innerHTML=`<div class="card"><h2>Hasil Ujian CBT</h2><h1 class="${score>=passing?'good':'bad'}" style="font-size:48px;margin:8px 0">${score} / 200</h1><h2>${score>=passing?'LULUS SIMULASI':'BELUM LULUS SIMULASI'}</h2><p>Benar ${correct}/50 · Salah atau kosong ${50-correct}/50 · Target ${passing}/200</p><p>${auto?'Waktu ujian habis.':'Jawaban berhasil dikumpulkan.'}</p><button class="btn" id="again">Ujian Baru (50 soal acak)</button></div><div class="card"><h3>Pembahasan 50 soal — alasan benar/salah dan rumus hitungan</h3>${qs.map((q,i)=>`<details style="border-bottom:1px solid #e2e8f0;padding:12px 0"><summary><b class="${answers[i]===q.ans?'good':'bad'}">No. ${i+1} · ${answers[i]===q.ans?'Benar':'Salah/kosong'} · ${answers[i]===q.ans?'+'+q.points:'0'} poin</b> — ${esc(CH[q.ch])}</summary><p class="jp">${esc(q.jp)}</p>${q.graph?graphSVG(q.graph):''}${q.visual?visualSVG(q.visual):''}<p>${esc(q.id)}</p><p>Jawaban Anda: <b>${answers[i]===null?'Belum dijawab':'ABCD'[answers[i]]}</b> · Jawaban benar: <b>${'ABCD'[q.ans]}</b></p>${answers[i]!==q.ans?`<div class="answer" style="border-left-color:#c43b3b"><b>Kenapa jawaban salah?</b><p>${esc(wrongReason(q,answers[i]))}</p></div>`:`<p class="good"><b>Benar!</b> ${esc(q.ex)}</p>`}<div class="answer"><b>Jawaban benar:</b> ${esc(q.opts[q.ans].replace('|',' — '))}<p><b>Penjelasan:</b> ${esc(q.ex)}</p></div></details>`).join('')}</div>`;document.getElementById('again').onclick=setup;window.scrollTo(0,0)}
setup();
</script></body></html>
